[project]
name = "saga"
version = "2.0.0-dev"
description = "Statistically Acceptable GAussians — test suite for discrete Gaussian samplers"
requires-python = ">=3.10"
# The repository ships under the PQShield Ltd. non-commercial research
# licence (see LICENCE) -- NOT MIT. Point at the file rather than assert
# an SPDX identifier that would misstate the terms.
license = {file = "LICENCE"}
authors = [
    {name = "James Howe"},
    {name = "Thomas Prest"},
    {name = "Thomas Ricosset"},
    {name = "Mélissa Rossi"},
]
dependencies = [
    "scipy>=1.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mpmath>=1.3"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["code/tests"]
